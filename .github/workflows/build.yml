name: Decomp Dev Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi g++ make curl

      - name: Install agbcc
        run: |
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Extract target asset data
        run: |
          # Note: You will need to securely provide a baserom 
          # placed at mzm_us_baserom.gba if your script requires it to run.
          python3 tools/extractor.py -r us

      - name: Compile project
        run: make us -j$(nproc)

      - name: Download objdiff-cli
        run: |
          curl -L -o objdiff-cli https://github.com
          chmod +x objdiff-cli

      - name: Generate decomp.dev report
        run: |
          ./objdiff-cli report generate -o build/report.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: build/report.json
