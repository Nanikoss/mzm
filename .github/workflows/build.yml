name: Build and Track Progress

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_project:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define your game's versions here (e.g., US, JP, EU)
        version: [ SLUS_203.88 ] 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install -r requirements.txt # Remove if your project doesn't use python dependencies

      - name: Run build system
        run: |
          python configure.py --version ${{ matrix.version }}
          ninja

      - name: Download objdiff-cli
        run: |
          # Automatically fetches the latest stable release tool
          curl -L -o objdiff-cli https://github.com
          chmod +x objdiff-cli

      - name: Generate progress report
        run: |
          ./objdiff-cli report generate -o build/report.json

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          # Crucial requirement: The artifact name must match this format exactly
          name: ${{ matrix.version }}_report
          path: build/report.json
